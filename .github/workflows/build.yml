---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gaming-os
            base: ghcr.io/ublue-os/bazzite-deck:stable
          - variant: gaming-os-nvidia
            base: ghcr.io/ublue-os/bazzite-deck-nvidia:stable

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME="${{ matrix.variant }}"

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        env:
          BASE_IMAGE: ${{ matrix.base }}
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Test the image
        run: |
          out=$(podman run --rm --entrypoint /bin/bash "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" -c '
            set -e
            echo "Removed extras check:"
            for p in waydroid tailscale makemkv cockpit-system; do rpm -q --quiet $p && echo "  still installed: $p" || echo "  removed: $p"; done
            for c in steam gamescope gaming-setup; do command -v $c > /dev/null && echo "  present: $c" || { echo "  MISSING: $c"; exit 1; }; done
            ls /usr/share/vulkan/icd.d/radeon_icd*.json /usr/share/vulkan/icd.d/intel_icd*.json > /dev/null && echo "  present: Vulkan drivers (AMD, Intel)" || { echo "  MISSING: Vulkan drivers"; exit 1; }
            ls /usr/lib/modules/*/vmlinuz > /dev/null && echo "  present: kernel $(ls /usr/lib/modules | head -1)" || { echo "  MISSING: kernel"; exit 1; }
            rpm -q --quiet linux-firmware && echo "  present: linux-firmware" || { echo "  MISSING: linux-firmware"; exit 1; }
            if grep -lE "^enabled *= *1" $(grep -l "^\[terra" /etc/yum.repos.d/*.repo 2>/dev/null) 2>/dev/null | grep -q .; then
              dnf5 repolist --enabled 2>/dev/null | grep -i terra && { echo "  PROBLEM: Terra package sources still enabled (installer build would fail)"; exit 1; }
            fi
            echo "  enabled package sources: $(dnf5 repolist --enabled 2>/dev/null | tail -n +2 | awk '{print $1}' | paste -sd ' ')"
            ls /usr/lib64/dri/radeonsi_drv_video.so > /dev/null 2>&1 && echo "  present: AMD video acceleration (VA-API)" || echo "  not found: AMD VA-API driver"
            ls /usr/lib64/dri/iHD_drv_video.so > /dev/null 2>&1 && echo "  present: Intel video acceleration (VA-API)" || echo "  not found: Intel VA-API driver"
            if [ "'"${{ matrix.variant }}"'" = gaming-os-nvidia ]; then
              nv=$(rpm -qa | grep -iE "nvidia" | grep -iE "kmod|driver" | head -3)
              [ -n "$nv" ] && echo "  NVIDIA driver: $nv" || { echo "  MISSING: NVIDIA driver"; exit 1; }
            fi
            echo "Driver packages:"
            for p in linux-firmware amd-gpu-firmware intel-gpu-firmware realtek-firmware iwlwifi-mvm-firmware mt7xxx-firmware intel-media-driver libva-intel-media-driver mesa-va-drivers thermald solaar piper ckb-next openrgb hplip ntfs-3g; do rpm -q --quiet $p && echo "  installed: $p" || echo "  not available: $p"; done
            just --justfile /usr/share/ublue-os/justfile --summary | tr " " "\n" | grep -E "^(gaming-setup|hardware-report|setup-decky)$"
            useradd -m tester && setpriv --reuid=tester --regid=tester --init-groups env HOME=/home/tester gaming-setup --report --no-gui | tail -25
          ' 2>&1) || { echo "$out"; echo "::error title=${{ matrix.variant }} test failed::$(echo "$out" | tail -20 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
          echo "$out"
          echo "::notice title=${{ matrix.variant }} test passed::$(echo "$out" | tail -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          if [ -z "${COSIGN_PRIVATE_KEY}" ]; then
            echo "::notice title=Image not signed::Add a SIGNING_SECRET repository secret to sign images (see README)."
            exit 0
          fi
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

