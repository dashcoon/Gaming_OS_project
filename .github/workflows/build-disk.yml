---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Graphics card: gaming-os (AMD/Intel) or gaming-os-nvidia (NVIDIA)"
        required: true
        type: choice
        default: gaming-os
        options:
          - gaming-os
          - gaming-os-nvidia
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        default: amd64
        options:
          - amd64
  push:
    branches:
      - main
    paths:
      - 'disk_config/**'
      - '.github/workflows/build-disk.yml'
  # After the images are rebuilt from a code change (not the daily rebuild)
  workflow_run:
    workflows: ["Build container image"]
    types: [completed]
    branches: [main]

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  # One installer build at a time; a newer one waits instead of cancelling the running one
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installer ISO
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ${{ inputs.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}  # the installer builder can't mount on 26.04 runners
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["anaconda-iso"]
        # Run by hand: the chosen version. On a push: both versions.
        variant: ${{ fromJSON(inputs.variant && format('["{0}"]', inputs.variant) || '["gaming-os","gaming-os-nvidia"]') }}
    env:
      IMAGE_NAME: ${{ matrix.variant }}
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build disk images
        id: build
        run: |
          set -euo pipefail
          CONFIG=./disk_config/iso.toml
          [ "${IMAGE_NAME}" = gaming-os-nvidia ] && CONFIG=./disk_config/iso-nvidia.toml
          mkdir -p output
          sudo podman pull "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          sudo podman run --rm --privileged --pull=newer --security-opt label=type:unconfined_t \
            -v "${CONFIG}:/config.toml:ro" -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${BIB_IMAGE}" \
            --type anaconda-iso --use-librepo=True --rootfs btrfs \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          sudo chown -R "$(id -u):$(id -g)" output
          ISO="$(find output -name '*.iso' | head -1)"
          mv "$ISO" "output/${IMAGE_NAME}-$(date +%Y%m%d).iso"
          ISO="$(find output -name '*.iso' | head -1)"
          ( cd output && sha256sum "$(basename "$ISO")" > "$(basename "$ISO").sha256" )
          find output -mindepth 1 -not -name '*.iso' -not -name '*.sha256' -exec rm -rf {} +
          ls -la output
          echo "output-directory=output" >> "$GITHUB_OUTPUT"

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.variant }}-installer-iso
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
      
      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
